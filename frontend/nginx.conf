# Production template for native Nginx on Windows.
# Replace trading.example.com and certificate paths before configuration test.
worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;

    log_format main escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"request_id":"$request_id","request":"$request","status":$status,'
        '"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time","referer":"$http_referer",'
        '"user_agent":"$http_user_agent"}';
    access_log logs/access.log main buffer=64k flush=5s;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    reset_timedout_connection on;
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 30s;
    client_max_body_size 1m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=readiness_per_ip:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=upload_per_ip:10m rate=2r/m;
    limit_req_zone $binary_remote_addr zone=ws_per_ip:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_conn_zone $binary_remote_addr zone=ws_conn_per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn_log_level warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/manifest+json application/xml image/svg+xml text/css text/plain text/xml;

    # Optional after verifying ngx_brotli is compiled/loaded:
    # include snippets/brotli.conf;

    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    upstream trading_backend {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name trading.example.com;
        limit_req zone=api_per_ip burst=40 nodelay;
        limit_conn conn_per_ip 10;

        location = /nginx/status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow ::1;
            deny all;
        }

        location / {
            return 308 https://trading.example.com$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name trading.example.com;
        root C:/apps/xauusd-trading-bot/frontend/dist;
        index index.html;

        # Reject unknown Host values after the TLS handshake.
        if ($host != trading.example.com) { return 444; }

        ssl_certificate certs/trading.example.com/fullchain.pem;
        ssl_certificate_key certs/trading.example.com/privkey.pem;
        ssl_trusted_certificate certs/trading.example.com/chain.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";
        ssl_prefer_server_ciphers off;
        ssl_ecdh_curve X25519:secp256r1;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_buffer_size 4k;

        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 1.0.0.1 ipv6=off valid=300s;
        resolver_timeout 5s;

        include snippets/security-headers.conf;
        limit_conn conn_per_ip 30;

        location = /nginx/status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow ::1;
            deny all;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /docs { return 404; }
        location = /redoc { return 404; }
        location = /openapi.json { return 404; }

        location = /api/v1/health/readiness {
            limit_req zone=readiness_per_ip burst=5 nodelay;
            limit_conn conn_per_ip 5;
            include snippets/proxy-common.conf;
            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
            add_header Cache-Control "no-store" always;
            proxy_pass http://trading_backend;
        }

        location = /api/v1/auth/login {
            limit_req zone=auth_per_ip burst=5 nodelay;
            limit_conn conn_per_ip 5;
            include snippets/proxy-common.conf;
            proxy_pass http://trading_backend;
        }

        location = /api/v1/backtests/uploads {
            client_max_body_size 52m;
            client_body_timeout 120s;
            limit_req zone=upload_per_ip burst=2 nodelay;
            limit_conn conn_per_ip 2;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header X-Powered-By;
            proxy_connect_timeout 5s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_request_buffering on;
            proxy_buffering on;
            proxy_pass http://trading_backend;
        }

        location = /api/v1/ws {
            limit_req zone=ws_per_ip burst=10 nodelay;
            limit_conn ws_conn_per_ip 20;
            access_log logs/websocket-access.log main;
            include snippets/proxy-websocket.conf;
            proxy_pass http://trading_backend;
        }

        location ^~ /api/v1/ws/ {
            limit_req zone=ws_per_ip burst=10 nodelay;
            limit_conn ws_conn_per_ip 20;
            access_log logs/websocket-access.log main;
            include snippets/proxy-websocket.conf;
            proxy_pass http://trading_backend;
        }

        location /api/ {
            limit_req zone=api_per_ip burst=40 nodelay;
            limit_conn conn_per_ip 20;
            include snippets/proxy-common.conf;
            proxy_pass http://trading_backend;
        }

        location = /index.html {
            include snippets/security-headers.conf;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Expires "0" always;
            try_files $uri =404;
        }

        location /assets/ {
            include snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
            access_log off;
        }

        location ~* \.(?:map|md|env|ini|log|sql)$ {
            return 404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
